<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 程式練習介面</title>
    <!-- <link rel="stylesheet" href="static/style.css"> -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <!-- CSS檔案連結 -->
</head>
<body>
    <div class="container">
        <h1>AI 程式練習助手</h1>
        <p>這是一個用於練習程式設計的 AI 助手。請在下方輸入您的程式碼，並點擊「執行」按鈕來查看結果。</p>
        <h3>請輸入選擇的學習主題:</h3>
        <form method="post">
        <div class="topics">
        <label>
            <input type="radio" name="topic" value="輸入輸出"> 輸入輸出
        </label>
        <label>
            <input type="radio"name="topic" value="條件判斷"> 條件判斷
        </label>
                <label>
            <input type="radio"name="topic" value="迴圈"> 迴圈
        </label>
                <label>
            <input type="radio"name="topic" value="串列"> 串列
        </label>
        </div>
        <button class="min-btn" type="submit" name="action" value="generate">幫我出題</button>
        
            <p>目前選擇的主題:{{topic}}</p>
       
        </form>
        <div class="question_ai">
            <h3>AI 出題:</h3>
            <p>{{ question_text }}</p>
            <div class="question_ai">
    

{% if question_data %}
    <form method="POST">
        <input type="hidden" name="topic" value="{{ topic }}">
        
        <label>
            <input type="radio" name="student_answer" value="A">
            A. {{ question_data["A"] }}
        </label>
        <label>
            <input type="radio" name="student_answer" value="B">
            B. {{ question_data["B"] }}
        </label>
        <label>
            <input type="radio" name="student_answer" value="C">
            C. {{ question_data["C"] }}
        </label>
        <label>
            <input type="radio" name="student_answer" value="D">
            D. {{ question_data["D"] }}
        </label>

        <button type="submit" class="min-btn" name="action" value="check">提交答案</button>
    </form>
    {% endif %}
</div>
        </div>
        {% if feedback %}
        <div class="feedback">
            <h3>AI 回饋:</h3>
            <p>{{ feedback }}</p>
        </div>
        {% endif %}
    </div>

</body>
</html>
